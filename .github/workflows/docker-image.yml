name: Docker Image CI

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # ⚠️ 必须添加这个 permissions 块，否则 GITHUB_TOKEN 没有权限推送到 ghcr.io
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 新增步骤：将仓库名转换为小写并设置为输出
    - name: Set repo name to lowercase
      id: string
      run: echo "repo=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./go
        push: true
        # 修改这里：使用上一步转换后的小写仓库名
        tags: ghcr.io/${{ steps.string.outputs.repo }}:${{ github.sha }}
        # 如果你还想要一个 latest 标签，可以这样写：
        # tags: |
        #   ghcr.io/${{ steps.string.outputs.repo }}:${{ github.sha }}
        #   ghcr.io/${{ steps.string.outputs.repo }}:latest
